</head>

<body>
    <div class="container">
        <h1>Worker Registration</h1>
        <p>Waste Pickup Platform</p>


    <form id="workerForm">
        <label for="name">Worker Name</label>
        <input type="text" id="name" placeholder="Enter worker name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label for="ward">Ward</label>
        <input type="text" id="ward" placeholder="Enter ward" required>

        <button type="submit">Register Worker</button>
    </form>

    <div id="message"></div>

    <a class="back" href="admin.html">Back to Admin Dashboard</a>
</div>

<script>
    document.getElementById("workerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const ward = document.getElementById("ward").value.trim();
        const message = document.getElementById("message");

        try {
            const response = await fetch("http://localhost:5000/api/workers", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, phone, ward })
            });

            const data = await response.json();

            if (!response.ok) {
                message.style.color = "red";
                message.textContent = data.message || "Registration failed.";
                return;
            }

            message.style.color = "green";
            message.textContent = "Worker Registered Successfully!";

            document.getElementById("workerForm").reset();
        } catch (error) {
            message.style.color = "red";
            message.textContent = "Backend connection failed. Please check the server.";
        }
    });
</script>
