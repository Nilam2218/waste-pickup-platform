
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Types</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1, h2 {
            text-align: center;
            color: #237547;
        }

        .back {
            color: #237547;
            text-decoration: none;
        }

        .form-box {
            background: #f8fbf9;
            border: 1px solid #d5e8dc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
        }

        .form-box label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-box button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #237547;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .form-box button:hover {
            background: #185c35;
        }

        .form-box button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .waste-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .waste-card {
            background: #f1f8f4;
            border: 1px solid #d5e8dc;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .waste-card h2 {
            color: #237547;
            font-size: 21px;
        }

        .waste-card p {
            color: #444;
            line-height: 1.5;
        }

        .icon {
            font-size: 42px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
                margin: 10px auto;
            }

            .waste-list {
                gap: 10px;
            }

            .waste-card {
                padding: 18px 8px;
            }

            .waste-card h2 {
                font-size: 17px;
            }

            .waste-card p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <a class="back" href="index.html">← Back to Home</a>

        <h1>Waste Types</h1>
        <p>Learn about different types of waste and how to separate them.</p>

        <div class="form-box">
            <h2>Add Waste Type</h2>

            <form id="wasteTypeForm">
                <label for="name">Waste Type Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="e.g. Metal Waste"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    rows="3"
                    placeholder="Enter waste type description"
                ></textarea>

                <button type="submit" id="addButton">
                    Add Waste Type
                </button>

                <p id="message" role="status"></p>
            </form>
        </div>

        <h2>Available Waste Types</h2>

        <div class="waste-list" id="wasteList"></div>

    </div>

    <script>
        const API_URL = "http://localhost:5000/api/waste-types";

        const form = document.getElementById("wasteTypeForm");
        const nameInput = document.getElementById("name");
        const descriptionInput = document.getElementById("description");
        const message = document.getElementById("message");
        const wasteList = document.getElementById("wasteList");
        const addButton = document.getElementById("addButton");

        // Waste type sathi card tayar karne
        function createWasteCard(waste) {
            const card = document.createElement("div");
            card.className = "waste-card";

            const icon = document.createElement("div");
            icon.className = "icon";
            icon.textContent = "♻️";

            const title = document.createElement("h2");
            title.textContent = waste.name;

            const description = document.createElement("p");
            description.textContent =
                waste.description || "No description provided.";

            card.appendChild(icon);
            card.appendChild(title);
            card.appendChild(description);

            return card;
        }

        // Database madhun sagle waste types load karne
        async function loadWasteTypes() {
            wasteList.replaceChildren();

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Could not load waste types.");
                }

                const wasteTypes = await response.json();

                // Database madhye aslele waste types dakhva
                wasteTypes.forEach(function(waste) {
                    wasteList.appendChild(createWasteCard(waste));
                });

            } catch (error) {
                console.error("Loading error:", error);

                message.style.color = "red";
                message.textContent =
                    "Waste types load zale nahit. Backend server check kara.";
            }
        }

        // Navin waste type database madhye save karne
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = nameInput.value.trim();
            const description = descriptionInput.value.trim();

            if (!name) {
                message.style.color = "red";
                message.textContent = "Please enter a waste type name.";
                return;
            }

            addButton.disabled = true;
            addButton.textContent = "Saving...";
            message.textContent = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Failed to save waste type."
                    );
                }

                form.reset();

                // Database madhun updated list punha load kara
                await loadWasteTypes();

                message.style.color = "green";
                message.textContent =
                    "Waste type added successfully!";

            } catch (error) {
                console.error("Saving error:", error);

                message.style.color = "red";
                message.textContent =
                    "Error: " + error.message;
            } finally {
                addButton.disabled = false;
                addButton.textContent = "Add Waste Type";
            }
        });

        // Page open zalyavar database madhun data ana
        loadWasteTypes();
    </script>
</body>
</html>
